name: Container Scan

on:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout
      id-token: write         # OIDC auth to Endor Labs
      issues: write           # PR comments
      pull-requests: write    # PR comments

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build . -t kdogra/webapp-demo:latest

      - name: Endor Labs container scan
        uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946 # v1.1.12
        with:
          namespace: kriti-learn
          scan_dependencies: false
          scan_container: true
          image: kdogra/webapp-demo:latest
          project_name: webapp-demo
          pr: false
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
